    get:
      tags:
      - Network
      summary: Retrieves network interfaces
      description: MQTT API :-  get_networkInterfaces <br> Retrieves the network interface configuration of the reader
      operationId: getNetworkinterfaces
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  availableNetworkInterfaces:
                    type: array
                    description: List of physical and virtual network interfaces currently available on the device
                    items:
                      type: string
                      description: The network interface identifier
                      enum:
                      - eth0
                      - mlan0
                      - bnep0
                      - uap0
                      - wan0
              examples:
                application/json:
                  value:
                    availableNetworkInterfaces:
                    - eth0
                    - mlan0
                    - bnep0
                    - uap0
                    - wan0
      security:
      - bearerAuth: []
