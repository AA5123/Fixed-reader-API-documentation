parameters:
- name: certname
  in: path
  required: true
  schema:
    type: string
put:
  tags:
  - Certificate
  summary: Refresh certificate
  description: MQTT API :-  set_refreshCertificate <br> Refreshes the specified certificate on the device
  operationId: setRefreshcertificate
  requestBody:
    content:
      application/json:
        schema:
          type: object
          properties:
            name:
              type: string
              description: Not required for REST API (certname path parameter is used). Required in the MQTT API payload.
              example: Server
            type:
              type: string
              example: server
        examples:
          set_refreshCertificate_server:
            value:
              name: Server
              type: server
  responses:
    '200':
      description: OK
  security:
  - bearerAuth: []
delete:
  tags:
  - Certificate
  summary: Delete certificate
  description: MQTT API :-  del_certificate <br> Delete the specified certificate from the device
  operationId: delCertificate
  requestBody:
    content:
      application/json:
        schema:
          type: object
          properties:
            name:
              type: string
              description: Not required for REST API (certname path parameter is used). Required in the MQTT API payload.
              example: reader
            type:
              type: string
              example: client
        examples:
          del_certificate:
            value:
              name: reader
              type: client
  responses:
    '200':
      description: OK
  security:
  - bearerAuth: []
