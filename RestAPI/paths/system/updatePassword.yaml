put:
  tags:
  - System
  summary: Changes the password on the reader
  description: MQTT API :-  set_password <br> Changes the password on the reader
  requestBody:
    content:
      application/json:
        schema:
          type: object
          properties:
            currentPassword:
              type: string
              example: change
            newPassword:
              type: string
              example: Mypass@123
            userName:
              type: string
              example: admin
        examples:
          set_password:
            value:
              currentPassword: change
              newPassword: Mypass@123
              userName: admin
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            type: string
            example: ''
  security:
  - bearerAuth: []
