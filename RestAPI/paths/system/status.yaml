get:
  tags:
  - System
  summary: Retrieves reader operational statistics
  description: MQTT API :-  get_status <br> Retrieves reader operational statistics. <br> This call must be made no less frequently than every 30 seconds.
  operationId: getStatus
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            type: object
            properties:
              antennas:
                type: object
                properties:
                  1:
                    type: string
                  2:
                    type: string
                  3:
                    type: string
                  4:
                    type: string
                  5:
                    type: string
                  6:
                    type: string
              cpu:
                type: object
                properties:
                  system:
                    type: number
                  user:
                    type: number
              flash:
                type: object
                properties:
                  platform:
                    type: object
                    properties:
                      free:
                        type: number
                      total:
                        type: number
                      used:
                        type: number
                  readerConfig:
                    type: object
                    properties:
                      free:
                        type: number
                      total:
                        type: number
                      used:
                        type: number
                  readerData:
                    type: object
                    properties:
                      free:
                        type: number
                      total:
                        type: number
                      used:
                        type: number
                  rootFileSystem:
                    type: object
                    properties:
                      free:
                        type: number
                      total:
                        type: number
                      used:
                        type: number
              interfaceConnectionStatus:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        connectionError:
                          type: string
                        connectionStatus:
                          type: string
                        description:
                          type: string
                        interface:
                          type: string
              ntp:
                type: object
                properties:
                  offset:
                    type: number
                  reach:
                    type: number
              powerNegotiation:
                type: string
              powerSource:
                type: string
              radioActivity:
                type: string
              radioConnection:
                type: string
              ram:
                type: object
                properties:
                  free:
                    type: number
                  total:
                    type: number
                  used:
                    type: number
              systemTime:
                type: string
              temperature:
                type: number
              uptime:
                type: string
              impinjGen2X:
                type: object
                properties:
                  active:
                    type: boolean
                    description: Indicates whether an Impinj Gen2X feature is currently active
                  feature:
                    type: string
                    description: The name of the active Impinj Gen2X feature
                    enum:
                    - fastId
                    - tagFocus
                    - tagProtect
                    - tagQuieting
          example:
            antennas:
              '1': disconnected
              '2': disconnected
              '3': disconnected
              '4': disconnected
              '5': connected
              '6': connected
            cpu:
              system: 0
              user: 2
            flash:
              platform:
                free: 0
                total: 0
                used: 0
              readerConfig:
                free: 0
                total: 0
                used: 0
              readerData:
                free: 0
                total: 0
                used: 0
              rootFileSystem:
                free: 0
                total: 0
                used: 0
            interfaceConnectionStatus:
              data:
              - connectionError: ''
                connectionStatus: connected
                description: WEBSOCKET_TESTs
                interface: WEBSOCKET_TEST
            ntp:
              offset: 0
              reach: 0
            powerNegotiation: POE+
            powerSource: PWR_BRICK
            radioActivity: inactive
            radioConnection: connected
            ram:
              free: 76
              total: 100
              used: 24
            systemTime: 13/06/2024 11:19
            temperature: 33
            uptime: 0D1H13M15S
            impinjGen2X:
              active: true
              feature: tagFocus
  security:
  - bearerAuth: []
