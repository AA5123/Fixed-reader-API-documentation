get:
  tags:
  - userapp
  summary: List user applications
  description: MQTT API :-  get_userapps <br> Lists all installed user applications
  operationId: getUserapps
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            type: array
            items:
              type: object
              properties:
                appname:
                  type: string
                  example: mylogger
                runningStatus:
                  type: boolean
                  example: true
                autostart:
                  type: boolean
                  example: false
                metadata:
                  type: string
                  example: 'APP_TYPE: DA'
          example:
          - appname: mylogger
            runningStatus: true
            autostart: false
            metadata: 'APP_TYPE: DA'
          - appname: sample
            runningStatus: false
            autostart: true
            metadata: 'APP_TYPE: NORMAL'
  security:
  - bearerAuth: []
